<header class="sticky top-0 z-40 border-b border-outline/70 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-[640px] items-center justify-between px-4">
    <a
      [routerLink]="rotaLogo()"
      class="flex items-center gap-2 rounded-lg text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      aria-label="AgendaArena, ir para o início"
    >
      <span aria-hidden="true" class="material-symbols-outlined icone-preenchido text-[28px]"
        >sports_soccer</span
      >
      <span class="text-lg font-extrabold tracking-tight">AgendaArena</span>
    </a>

    @if (usuario(); as atual) {
      <div class="relative">
        <button
          type="button"
          class="flex h-11 items-center gap-2 rounded-full border border-outline bg-white py-1 pl-1 pr-3 transition hover:bg-surface"
          [attr.aria-expanded]="menuAberto()"
          aria-haspopup="menu"
          (click)="menuAberto.set(!menuAberto())"
        >
          <span
            class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-container text-xs font-bold text-white"
            aria-hidden="true"
          >
            {{ iniciais() }}
          </span>
          <span aria-hidden="true" class="material-symbols-outlined text-xl text-on-surface-variant"
            >expand_more</span
          >
          <span class="sr-only">Menu do usuário</span>
        </button>

        @if (menuAberto()) {
          <div class="fixed inset-0 z-30" (click)="menuAberto.set(false)"></div>
          <div
            class="absolute right-0 z-40 mt-2 w-64 overflow-hidden rounded-xl border border-outline bg-white shadow-xl"
            role="menu"
          >
            <div class="border-b border-outline/70 px-4 py-3">
              <p class="truncate text-sm font-semibold text-on-surface">{{ atual.nome }}</p>
              <p class="mt-0.5 text-xs text-on-surface-variant">{{ perfil() }}</p>
            </div>
            <button
              type="button"
              class="flex min-h-12 w-full items-center gap-3 px-4 text-left text-sm font-medium text-on-surface transition hover:bg-surface"
              role="menuitem"
              (click)="abrirConfirmacao()"
            >
              <span aria-hidden="true" class="material-symbols-outlined text-xl text-primary"
                >restart_alt</span
              >
              Restaurar dados de demonstração
            </button>
            <button
              type="button"
              class="flex min-h-12 w-full items-center gap-3 px-4 text-left text-sm font-medium text-error transition hover:bg-error/5"
              role="menuitem"
              (click)="sair()"
            >
              <span aria-hidden="true" class="material-symbols-outlined text-xl">logout</span>
              Sair
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>

<app-modal
  [aberto]="confirmacaoAberta()"
  titulo="Restaurar dados de demonstração?"
  (fechar)="confirmacaoAberta.set(false)"
>
  <p class="text-sm leading-relaxed text-on-surface-variant">
    As reservas, quadras e alterações feitas neste navegador serão apagadas e os dados de exemplo
    serão recarregados a partir de hoje.
  </p>
  <div class="mt-5 space-y-2">
    <button type="button" class="btn-perigo" (click)="confirmarRestauracao()">
      Restaurar dados
    </button>
    <button type="button" class="btn-suave" (click)="confirmacaoAberta.set(false)">Cancelar</button>
  </div>
</app-modal>
